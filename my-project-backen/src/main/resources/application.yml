spring:
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VHOST:/}
  security:
    filter:
      order: -100
    jwt:
      key: ${JWT_SECRET:change-this-local-secret}
      expire: ${JWT_EXPIRE_DAYS:7}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    verify:
      mail-limit: ${MAIL_CODE_INTERVAL:60}
    flow:
      period: ${FLOW_PERIOD:2}
      limit: ${FLOW_LIMIT:50}
      block: ${FLOW_BLOCK_SECONDS:30}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    username: ${MINIO_USERNAME:minio}
    password: ${MINIO_PASSWORD:password}
  data:
    redis:
      port: ${REDIS_PORT:6385}
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}
  weather:
    key: ${WEATHER_API_KEY:}
